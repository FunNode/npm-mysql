name: npm package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: "funnode"
          MYSQL_ROOT_PASSWORD: "password"
        ports:
        - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test
      # CodeClimate integration - disabled (Code Climate API was discontinued as of July 18, 2025)
      # - uses: paambaati/codeclimate-action@v2.3.0
      #   env:
      #     CC_TEST_REPORTER_ID: ${{secrets.cc_reporter_id}}
      #   with:
      #     coverageCommand: npm run coverage
  publish-gpr:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@RaviPatel'
      - run: npm ci
      - run: |
          echo "@username:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GPR_PERSONAL_TOKEN }}" >> .npmrc
      - run: |
          PUBLISHED=$(npm view $(node -p "require('./package.json').name") version --registry https://npm.pkg.github.com/ 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" != "$CURRENT" ]; then npm publish; else echo "Version $CURRENT already published, skipping."; fi
        env:
          NODE_AUTH_TOKEN: ${{secrets.GPR_PERSONAL_TOKEN}}
